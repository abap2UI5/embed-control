# Monthly, grouped: one pull request per ecosystem and update type, so the
# e2e suite (against abap2UI5 main and the 1.145.0 floor) decides whether a
# bump is safe. The control itself has no dependencies; what moves here is
# the tooling of the workspace and its examples (UI5 CLI, Playwright, lint).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      dependencies-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
