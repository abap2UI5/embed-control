# Monthly, grouped: one pull request per ecosystem and update type, so CI
# decides whether a bump is safe. The control itself has no dependencies;
# what moves here is the tooling of the workspace (lint, format). The
# examples' tooling is bumped in abap2UI5/samples-embed-control.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      dependencies-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
