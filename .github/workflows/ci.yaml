name: ci

# check - lint, format, the consumer builds of both examples (the control
#         has to land in dist/thirdparty/), the package contents, and the
#         packed package built in an app of its own with UI5 CLI 3 and 4
# bsp   - the tree abap2UI5/frontend-embed-control delivers
#         (frontend_deploy.yaml): both examples as UI5 projects and the
#         freestyle one as BSP, built and checked with abap2UI5's tools - a
#         change that breaks it shows here, not in the delivery after the
#         merge. Here with the control of this commit; the delivery takes it
#         from npm
# e2e   - both examples in a browser against a live abap2UI5 backend:
#         abap2UI5 main, transpiled to JavaScript and served by its own
#         express server (npm run express) - no SAP system involved. The
#         control loads the frontend from that backend (?z2ui5-bundle), so
#         what is tested is the pair a user gets: this control and the
#         current abap2UI5

on:
  pull_request:
  push:
    branches: [main]
  # abap2UI5 changes without a pull request here, and the e2e job tests
  # against its current main - so everything runs every night as well, and a
  # change there that breaks the control shows up the next morning
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  # publish.yaml runs all of it on the commit it publishes
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The examples name the package by version range, as an app from the
      # registry does, and npm links the workspace only while its version is
      # inside that range. Past it, npm installs the PUBLISHED version into
      # an example without a word, and the build and the e2e test that
      # instead of this commit. Raise the examples' ranges with the version.
      - name: The examples use this package, not a published one
        if: ${{ !cancelled() }}
        run: |
          test -L node_modules/@abap2ui5/embed-control
          for example in examples/*/; do
            test ! -e "${example}node_modules/@abap2ui5/embed-control"
          done
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm run format:check
        if: ${{ !cancelled() }}
      - run: npm run build
        if: ${{ !cancelled() }}
      # the consumer build: the control is copied into each app
      # (includeDependency in its ui5.yaml), next to it and not under
      # resources/ - the Fiori elements app as much as the freestyle one
      - name: The control is part of the built apps
        if: ${{ !cancelled() }}
        run: |
          for example in examples/freestyle examples/fiori-elements; do
            test -f "$example/dist/thirdparty/z2ui5/embed/Container.js"
            test -f "$example/dist/thirdparty/z2ui5/embed/Container.css"
            test ! -e "$example/dist/resources"
          done
      - run: npm run pack:check
        if: ${{ !cancelled() }}
      # the tarball, installed into an app outside this workspace and built
      # with UI5 CLI 3 and 4 - what a consumer gets, which the example cannot
      # show: it takes the package through the workspace link, on CLI 4 only
      - run: npm run consumer:check
        if: ${{ !cancelled() }}

  bsp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the BSP tools only - they need nothing but node
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abap2UI5/abap2UI5
          path: .abap2ui5
          sparse-checkout: tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm run bsp
        env:
          ABAP2UI5_DIR: .abap2ui5

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abap2UI5/abap2UI5
          path: .abap2ui5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .abap2ui5/package-lock.json

      - name: Build the abap2UI5 backend
        working-directory: .abap2ui5
        run: |
          npm ci
          npm run downport
          npm run auto_transpile
      - name: Start it on port 3000
        working-directory: .abap2ui5
        run: |
          HOST=127.0.0.1 PORT=3000 nohup npm run express > "$RUNNER_TEMP/express.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:3000/ && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/express.log"
          exit 1

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
      - if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/express.log"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
