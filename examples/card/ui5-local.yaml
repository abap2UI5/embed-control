# `npm run start-local`: the card against abap2UI5 running locally in Node
# instead of an SAP system. The same as ui5.yaml but for the proxy's target -
# ui5.yaml is the one to read.
specVersion: "4.0"
metadata:
  name: demo.card
type: application
framework:
  name: OpenUI5
  version: "1.136.21"
  # sap.ui.integration renders the card in the preview - in SAP Build Work
  # Zone the host brings its own SAPUI5. The embedded abap2UI5 apps load
  # whatever library their ABAP view names - the hello world app uses
  # sap.ui.layout (SimpleForm). List every library your ABAP apps use.
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.ui.integration
    - name: sap.ui.layout
    - name: themelib_sap_horizon
builder:
  resources:
    # the preview page is for trying the card here - it is no part of the
    # card that is deployed
    excludes:
      - "/test/**"
  # The control comes from npm like any dependency; `ui5 serve` serves it
  # anyway, `ui5 build` copies it into dist/thirdparty/z2ui5/embed/ only when
  # it is named here - and the card needs it there: it is deployed on its own
  # and registers the control's namespace relative to itself.
  settings:
    includeDependency:
      - "@abap2ui5/embed-control"
server:
  customMiddleware:
    # /sap/** goes to abap2UI5 running locally in Node, no SAP system needed
    # - @abap2ui5/node-runtime from npm, or an abap2UI5 checkout (README).
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /sap
      configuration:
        baseUri: http://localhost:3000/sap
