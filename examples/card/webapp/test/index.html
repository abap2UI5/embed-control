<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>abap2UI5 card - preview</title>
    <!-- Not part of the card: a stand-in for a page of SAP Build Work Zone,
         to try the card with `ui5 serve` (preview.js) -->
    <script
        id="sap-ui-bootstrap"
        src="../resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.ui.integration"
        data-sap-ui-resource-roots='{ "preview": "./" }'
        data-sap-ui-on-init="module:preview/preview"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
    ></script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
