# `npm run start-local`: the app against abap2UI5 running locally in Node
# instead of an SAP system. The same as ui5.yaml but for the proxy's target -
# ui5.yaml is the one to read.
specVersion: "4.0"
metadata:
  name: demo.fev2
type: application
framework:
  # Fiori elements for OData V2 (sap.suite.ui.generic.template) is part of
  # SAPUI5, not of OpenUI5
  name: SAPUI5
  version: "1.136.21"
  # The embedded abap2UI5 apps load whatever library their ABAP view names -
  # the hello world app uses sap.ui.layout (SimpleForm). List every library
  # your ABAP apps use, not only the ones the Fiori elements app uses itself.
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.suite.ui.generic.template
    - name: sap.ui.layout
    - name: themelib_sap_horizon
# The control comes from npm like any dependency; `ui5 serve` serves it
# anyway, `ui5 build` copies it into dist/thirdparty/z2ui5/embed/ only when
# it is named here. The abap2UI5 frontend is no part of the build: the
# control loads it from the backend at run time.
builder:
  settings:
    includeDependency:
      - "@abap2ui5/embed-control"
server:
  customMiddleware:
    # The OData V2 service of the Fiori elements app, answered from
    # webapp/localService under the paths the RAP service of abap/ has in a
    # system: its metadata, the annotations of its metadata extension and the
    # data. With the RAP service installed, delete this entry, and /sap/opu
    # goes through the proxy below to the real one.
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/Z2UI5_UI_EMBED_COUNTRY_O2
            metadataPath: ./webapp/localService/metadata.xml
            mockdataPath: ./webapp/localService/data
            generateMockData: false
        annotations:
          - localPath: ./webapp/localService/Z2UI5_UI_EMBED_COUNTRY_O2_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='Z2UI5_UI_EMBED_COUNTRY_O2_VAN',Version='0001')/$value/
    # /sap/** goes to abap2UI5 running locally in Node, no SAP system needed
    # - @abap2ui5/node-runtime from npm, or an abap2UI5 checkout (README).
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /sap
      configuration:
        baseUri: http://localhost:3000/sap
