# The example on the oldest UI5 release abap2UI5 supports - for the tests
# (the second Playwright project), not for copying: ui5.yaml is the one to
# read. It is ui5-local.yaml with another framework: 1.71 has no Horizon
# theme, so the tests open it with ?sap-ui-theme=sap_fiori_3.
specVersion: "4.0"
metadata:
  name: demo.host
type: application
framework:
  name: OpenUI5
  version: "1.71.81"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /sap
      configuration:
        baseUri: http://localhost:3000/sap
